<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Lead Catcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12936a"/>
      <stop offset="1" stop-color="#0a5a41"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- envelope: the contact that was caught -->
  <rect x="22" y="40" width="74" height="54" rx="9" fill="#ffffff"/>
  <path d="M29 49 L59 72 L89 49" fill="none" stroke="#0b6e4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- badge: a new match -->
  <circle cx="94" cy="40" r="19" fill="#0d6f50"/>
  <circle cx="94" cy="40" r="14" fill="#f6b72c"/>
  <path d="M87 40.5 L92 45.5 L101 35" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
